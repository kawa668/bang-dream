<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>控制台</title>
    <style>
      :root {
        --ink: #2b3446;
        --ink-soft: #5b6678;
        --bg: #f6f5f1;
        --surface: #ffffff;
        --surface-muted: #eef1ea;
        --border: #dfe3d9;
        --mint: #6f9573;
        --mint-deep: #4f6f54;
        --mint-soft: #e3eee2;
        --indigo: #3a4a63;
        --indigo-deep: #2b3749;
        --blush: #d98a9d;
        --focus: #3b6ef0;
        --shadow: 0 6px 20px rgba(43, 52, 70, 0.08);
        --radius: 8px;
        --radius-sm: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", sans-serif;
        color: var(--ink);
        background: var(--bg);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      [hidden] {
        display: none !important;
      }

      h1,
      h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: 18px;
        font-weight: 700;
        color: var(--indigo-deep);
      }

      h2 {
        font-size: 14px;
        font-weight: 700;
        color: var(--indigo);
      }

      button,
      input,
      select,
      textarea,
      summary {
        font-family: inherit;
        font-size: 13px;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-radius: 6px;
      }

      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 64px;
        height: 32px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex: none;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      .hint {
        margin: 0;
        font-size: 11px;
        color: var(--ink-soft);
        text-align: right;
        line-height: 1.4;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 12px;
      }

      .panel-title {
        margin-bottom: 10px;
      }

      .panel > .collapse-toggle {
        margin-bottom: 6px;
      }

      .status {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--ink-soft);
        white-space: pre-wrap;
      }

      /* chat */
      #chat-window {
        display: flex;
        flex-direction: column;
        height: 260px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: var(--surface);
      }

      #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .chat-message {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        max-width: 100%;
      }

      .chat-body {
        display: flex;
        flex-direction: column;
        max-width: 78%;
        min-width: 0;
      }

      .chat-avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        flex: none;
        object-fit: cover;
        border: 1px solid var(--border);
        background: var(--surface-muted);
      }

      .chat-avatar--user {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--indigo);
        border-color: var(--indigo-deep);
        color: #fff;
      }

      .chat-message .chat-author {
        font-size: 11px;
        color: var(--ink-soft);
        margin: 0 4px 3px;
      }

      .chat-message .chat-content {
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 13px;
      }

      .chat-user {
        justify-content: flex-end;
        align-items: flex-end;
      }

      .chat-user .chat-avatar {
        order: 2;
      }

      .chat-user .chat-body {
        align-items: flex-end;
      }

      .chat-user .chat-content {
        background: var(--indigo);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .chat-assistant {
        align-items: flex-start;
      }

      .chat-assistant .chat-body {
        align-items: flex-start;
      }

      .chat-assistant .chat-content {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--ink);
        border-bottom-left-radius: 4px;
      }

      .chat-system {
        align-items: center;
        justify-content: center;
        max-width: 100%;
      }

      .chat-system .chat-content {
        background: var(--surface-muted);
        color: var(--ink-soft);
        border-radius: 8px;
        font-size: 12px;
      }

      .chat-empty {
        margin: auto;
        color: var(--ink-soft);
        font-size: 12px;
        text-align: center;
        line-height: 1.6;
      }

      #chat-input-row {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      #chat-input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--ink);
        background: var(--surface);
      }

      #chat-input::placeholder {
        color: var(--ink-soft);
      }

      #chat-status {
        margin-top: 6px;
      }

      #stt-button.mic {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      #stt-button.mic.recording {
        color: #fff;
        background: var(--blush, #d98a9d);
        border-color: var(--blush, #d98a9d);
      }

      #stt-status {
        margin-top: 2px;
        color: var(--ink-soft);
      }

      /* buttons */
      .btn {
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 8px 12px;
        min-height: 36px;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.15s ease, border-color 0.15s ease,
          color 0.15s ease;
      }

      .btn.primary {
        background: var(--indigo);
        color: #fff;
      }

      .btn.primary:hover {
        background: var(--indigo-deep);
      }

      .btn.ghost {
        background: transparent;
        border-color: var(--border);
        color: var(--ink-soft);
      }

      .btn.ghost:hover {
        background: var(--surface-muted);
        color: var(--ink);
      }

      /* voice */
      #voice-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .switch {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }

      .switch input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .switch-track {
        width: 38px;
        height: 22px;
        border-radius: 999px;
        background: var(--border);
        position: relative;
        transition: background-color 0.18s ease;
        flex: none;
      }

      .switch-track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        transition: transform 0.18s ease;
      }

      .switch input:checked + .switch-track {
        background: var(--blush);
      }

      .switch input:checked + .switch-track::after {
        transform: translateX(16px);
      }

      .switch input:focus-visible + .switch-track {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .switch-label {
        font-size: 13px;
        color: var(--ink);
      }

      .field-inline {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--ink-soft);
      }

      #voice-select,
      select {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 9px;
        min-height: 34px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
      }

      /* llm drawer */
      details.panel {
        overflow: hidden;
      }

      details.panel > summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
        color: var(--indigo);
        user-select: none;
      }

      details.panel > summary::-webkit-details-marker {
        display: none;
      }

      details.panel > summary::after {
        content: "";
        margin-left: auto;
        width: 7px;
        height: 7px;
        border-right: 2px solid var(--ink-soft);
        border-bottom: 2px solid var(--ink-soft);
        transform: rotate(-45deg);
        transition: transform 0.16s ease;
      }

      details.panel[open] > summary::after {
        transform: rotate(45deg) translate(-2px, -2px);
      }

      .drawer-body {
        padding-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field > span {
        font-size: 12px;
        color: var(--ink-soft);
      }

      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--ink);
        background: var(--surface);
        resize: vertical;
      }

      .field input:focus,
      .field textarea:focus,
      #chat-input:focus {
        border-color: var(--mint);
      }

      #config-save {
        align-self: flex-start;
      }

      #config-status {
        margin-top: 6px;
      }

      /* models */
      #model-buttons,
      #action-groups {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .collapse-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
        padding: 7px 10px;
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      .collapse-toggle:hover {
        border-color: var(--mint);
        background: var(--mint-soft);
      }

      .collapse-toggle .toggle-label {
        flex: 1;
        text-align: left;
      }

      .toggle-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .collapse-toggle .toggle-count {
        font-size: 11px;
        font-weight: 600;
        color: var(--ink-soft);
        background: var(--surface);
        border-radius: 999px;
        padding: 1px 8px;
      }

      .collapse-toggle .toggle-chevron {
        display: inline-flex;
        color: var(--ink-soft);
        transition: transform 0.16s ease;
      }

      .collapse-toggle.open .toggle-chevron {
        transform: rotate(90deg);
      }

      .category-buttons,
      .action-buttons,
      .character-models,
      .menu-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px 0 8px;
      }

      #model-buttons .category-buttons button,
      .action-buttons button {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        padding: 6px 11px;
        min-height: 32px;
        cursor: pointer;
        font-size: 12px;
        transition: background-color 0.15s ease, border-color 0.15s ease,
          color 0.15s ease;
      }

      #model-buttons .category-buttons button:hover,
      .action-buttons button:hover {
        border-color: var(--mint);
        background: var(--mint-soft);
      }

      #model-buttons .category-buttons button.active {
        background: var(--indigo);
        border-color: var(--indigo);
        color: #fff;
        font-weight: 700;
      }

      #voice-status {
        margin: 0;
      }

      .app-footer {
        margin-top: auto;
        padding-top: 4px;
      }

      .app-footer .status {
        margin: 0;
        font-size: 11px;
        color: var(--ink-soft);
      }

      .footer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .footer-brands {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
      }

      .brand-mini {
        height: 16px;
        width: 32px;
        border-radius: 5px;
        background: #ffffff;
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex: none;
        opacity: 0.85;
      }

      .brand-mini img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 999px;
        border: 2px solid var(--surface);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--mint);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="/icons/mygo-logo.png" alt="" /></span>
        <h1>控制台</h1>
      </div>
      <p class="hint">F1–F4 切换常用模型</p>
    </header>

    <section class="panel" aria-labelledby="chat-title">
      <h2 id="chat-title" class="panel-title">聊天</h2>
      <div id="chat-window">
        <div id="chat-messages"></div>
        <div id="chat-input-row">
          <input id="chat-input" type="text" placeholder="和宠物说话..." />
          <button id="stt-button" class="btn ghost mic" type="button" aria-label="按住说话" title="按住说话">
            <svg viewBox="0 0 24 24" width="16" height="16" role="presentation"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z" fill="currentColor"/><path d="M5 11a1 1 0 1 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-3.08A7 7 0 0 1 5 11z" fill="currentColor"/></svg>
          </button>
          <button id="chat-send" class="btn primary" type="button">发送</button>
          <button id="chat-clear" class="btn ghost" type="button">清空</button>
        </div>
      </div>
      <p id="chat-status" class="status" role="status"></p>
      <p id="stt-status" class="status" role="status"></p>
    </section>

    <section class="panel" aria-labelledby="voice-title">
      <h2 id="voice-title" class="panel-title">语音</h2>
      <div id="voice-controls">
        <label class="switch">
          <input id="voice-enabled" type="checkbox" />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-label">语音回复</span>
        </label>
        <label class="field-inline">
          <span>音色</span>
          <select id="voice-select"></select>
        </label>
      </div>
      <p id="voice-status" class="status" role="status"></p>
    </section>

    <details id="llm-settings" class="panel">
      <summary>LLM 设置</summary>
      <div class="drawer-body">
        <label class="field">
          <span>Base URL</span>
          <input id="llm-base-url" type="url" placeholder="https://relay.example.com/v1" />
        </label>
        <label class="field">
          <span>API Key</span>
          <input id="llm-api-key" type="password" placeholder="留空表示不修改" />
        </label>
        <label class="field">
          <span>模型</span>
          <input id="llm-model" type="text" />
        </label>
        <label class="field">
          <span>System Prompt</span>
          <textarea id="llm-system-prompt" rows="3"></textarea>
        </label>
        <label class="field">
          <span>Temperature</span>
          <input id="llm-temperature" type="number" step="0.1" min="0" max="2" />
        </label>
        <label class="field">
          <span>超时（毫秒）</span>
          <input id="llm-timeout" type="number" min="1000" />
        </label>
        <label class="field">
          <span>历史消息数</span>
          <input id="llm-max-history" type="number" min="1" />
        </label>
        <button id="config-save" class="btn primary" type="button">保存设置</button>
        <p id="config-status" class="status" role="status"></p>
      </div>
    </details>

    <section class="panel" aria-labelledby="model-title">
      <h2 id="model-title" class="panel-title">人物</h2>
      <div id="model-buttons"></div>
    </section>

    <section class="panel" aria-labelledby="action-title">
      <h2 id="action-title" class="panel-title">动作</h2>
      <div id="action-groups"></div>
    </section>

    <footer class="app-footer">
      <div class="footer-row">
        <p id="status" class="status" role="status">正在启动...</p>
        <div class="footer-brands" aria-hidden="true">
          <span class="brand-mini"><img src="/icons/mygo-logo.png" alt="MyGO!!!!!" /></span>
          <span class="brand-mini"><img src="/icons/ave-mujica.jpg" alt="Ave Mujica" /></span>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/control.ts"></script>
  </body>
</html>
