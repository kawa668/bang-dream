<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>若叶睦 Live2D</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      [hidden] {
        display: none !important;
      }

      #live2d-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #voice-audio {
        display: none;
      }

      #context-menu {
        display: none;
        position: fixed;
        z-index: 9999;
        min-width: 240px;
        max-width: 300px;
        max-height: 82vh;
        overflow: auto;
        background: #f6f5f1;
        border: 1px solid #dfe3d9;
        border-radius: 8px;
        padding: 8px;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", sans-serif;
        color: #2b3446;
        box-shadow: 0 16px 40px rgba(43, 52, 70, 0.22);
      }

      #context-menu.visible {
        display: block;
      }

      #context-menu h3 {
        margin: 10px 4px 6px;
        font-size: 12px;
        font-weight: 700;
        color: #3a4a63;
        letter-spacing: 0;
      }

      #context-menu .toggle-label {
        flex: 1;
        text-align: left;
      }

      #context-menu .toggle-icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        border: 1px solid #dfe3d9;
        background: #ffffff;
      }

      #context-menu .toggle-count {
        font-size: 11px;
        font-weight: 600;
        color: #5b6678;
        background: #ffffff;
        border-radius: 999px;
        padding: 1px 8px;
      }

      #context-menu .toggle-chevron {
        display: inline-flex;
        color: #5b6678;
        transition: transform 0.16s ease;
      }

      #context-menu .collapse-toggle.open .toggle-chevron {
        transform: rotate(90deg);
      }

      #context-menu .collapse-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        text-align: left;
        margin: 3px 0;
        padding: 6px 10px;
        cursor: pointer;
        border: 1px solid #dfe3d9;
        border-radius: 8px;
        background: #eef1ea;
        font-size: 13px;
        font-weight: 600;
        color: #2b3446;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      #context-menu .collapse-toggle:hover {
        border-color: #6f9573;
        background: #e3eee2;
      }

      #context-menu .menu-item {
        display: block;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        padding: 8px 10px;
        margin: 0;
        cursor: pointer;
        font-size: 13px;
        color: #2b3446;
        border-radius: 8px;
        transition: background-color 0.15s ease;
      }

      #context-menu .menu-item:hover {
        background: #e3eee2;
      }

      #context-menu .menu-section {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #dfe3d9;
      }

      #context-menu .menu-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 2px 0 6px;
      }

      :focus-visible {
        outline: 2px solid #3b6ef0;
        outline-offset: 2px;
        border-radius: 6px;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: #dfe3d9;
        border-radius: 999px;
        border: 2px solid #f6f5f1;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #6f9573;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="./vendor/live2d.min.js"></script>
    <canvas id="live2d-canvas" tabindex="-1"></canvas>
    <div id="context-menu"></div>
    <div
      id="control-panel"
      class="control-panel"
      role="dialog"
      aria-modal="false"
      aria-label="Live2D 控制面板"
      tabindex="-1"
      hidden
    >
      <header class="panel-header">
        <div class="panel-identity">
          <strong id="panel-character-name">若叶睦</strong>
          <span id="panel-model">便装</span>
        </div>
        <span id="panel-voice-summary" class="panel-summary">语音已关闭</span>
        <button id="panel-close" class="icon-button" type="button" aria-label="关闭控制面板">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </header>

      <div id="panel-tabs" class="panel-tabs" role="tablist" aria-label="控制面板页签">
        <button id="tab-chat" type="button" role="tab" data-tab="chat" aria-controls="panel-chat" aria-selected="true">聊天</button>
        <button id="tab-voice" type="button" role="tab" data-tab="voice" aria-controls="panel-voice" aria-selected="false">语音</button>
        <button id="tab-ai" type="button" role="tab" data-tab="ai" aria-controls="panel-ai" aria-selected="false">AI</button>
        <button id="tab-character" type="button" role="tab" data-tab="character" aria-controls="panel-character" aria-selected="false">角色</button>
      </div>

      <div class="panel-body">
        <section id="panel-chat" class="panel-view" role="tabpanel" data-panel="chat" aria-labelledby="tab-chat"></section>
        <section id="panel-voice" class="panel-view" role="tabpanel" data-panel="voice" aria-labelledby="tab-voice" hidden></section>
        <section id="panel-ai" class="panel-view" role="tabpanel" data-panel="ai" aria-labelledby="tab-ai" hidden></section>
        <section id="panel-character" class="panel-view" role="tabpanel" data-panel="character" aria-labelledby="tab-character" hidden></section>
      </div>

      <footer class="panel-footer">
        <p id="panel-global-status" class="status" role="status">正在启动...</p>
      </footer>
    </div>
    <audio id="voice-audio"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
