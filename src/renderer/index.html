<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>若叶睦 Live2D</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      [hidden] {
        display: none !important;
      }

      #live2d-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #voice-audio {
        display: none;
      }

      #context-menu {
        display: none;
        position: fixed;
        z-index: 9999;
        min-width: 240px;
        max-width: 300px;
        max-height: 82vh;
        overflow: auto;
        background: #f6f5f1;
        border: 1px solid #dfe3d9;
        border-radius: 8px;
        padding: 8px;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", sans-serif;
        color: #2b3446;
        box-shadow: 0 16px 40px rgba(43, 52, 70, 0.22);
      }

      #context-menu.visible {
        display: block;
      }

      #context-menu h3 {
        margin: 10px 4px 6px;
        font-size: 12px;
        font-weight: 700;
        color: #3a4a63;
        letter-spacing: 0;
      }

      #context-menu .toggle-label {
        flex: 1;
        text-align: left;
      }

      #context-menu .toggle-icon {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
        border: 1px solid #dfe3d9;
        background: #ffffff;
      }

      #context-menu .toggle-count {
        font-size: 11px;
        font-weight: 600;
        color: #5b6678;
        background: #ffffff;
        border-radius: 999px;
        padding: 1px 8px;
      }

      #context-menu .toggle-chevron {
        display: inline-flex;
        color: #5b6678;
        transition: transform 0.16s ease;
      }

      #context-menu .collapse-toggle.open .toggle-chevron {
        transform: rotate(90deg);
      }

      #context-menu .collapse-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        text-align: left;
        margin: 3px 0;
        padding: 6px 10px;
        cursor: pointer;
        border: 1px solid #dfe3d9;
        border-radius: 8px;
        background: #eef1ea;
        font-size: 13px;
        font-weight: 600;
        color: #2b3446;
        transition: background-color 0.15s ease, border-color 0.15s ease;
      }

      #context-menu .collapse-toggle:hover {
        border-color: #6f9573;
        background: #e3eee2;
      }

      #context-menu .menu-item {
        display: block;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        padding: 8px 10px;
        margin: 0;
        cursor: pointer;
        font-size: 13px;
        color: #2b3446;
        border-radius: 8px;
        transition: background-color 0.15s ease;
      }

      #context-menu .menu-item:hover {
        background: #e3eee2;
      }

      #context-menu .menu-section {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #dfe3d9;
      }

      #context-menu .menu-group {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 2px 0 6px;
      }

      :focus-visible {
        outline: 2px solid #3b6ef0;
        outline-offset: 2px;
        border-radius: 6px;
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: #dfe3d9;
        border-radius: 999px;
        border: 2px solid #f6f5f1;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #6f9573;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0ms !important;
          animation-duration: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="./vendor/live2d.min.js"></script>
    <canvas id="live2d-canvas"></canvas>
    <div id="context-menu"></div>
    <audio id="voice-audio"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
