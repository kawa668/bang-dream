<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>若叶睦 Live2D</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      [hidden] { display: none !important; }
      #live2d-canvas { width: 100%; height: 100%; display: block; }
      #voice-audio { display: none; }
      #context-menu {
        display: none;
        position: fixed;
        z-index: 9999;
        min-width: 220px;
        max-height: 80vh;
        overflow: auto;
        background: #fff;
        border: 1px solid #bbb;
        padding: 8px;
        font-family: system-ui, sans-serif;
      }
      #context-menu.visible { display: block; }
      #context-menu h3 { margin: 8px 0 4px; font-size: 13px; }
      #context-menu .menu-item {
        display: block;
        width: 100%;
        border: 0;
        background: none;
        text-align: left;
        padding: 4px 6px;
        cursor: pointer;
        font-size: 13px;
      }
      #context-menu .menu-item:hover { background: #eef3ff; }
      #context-menu .menu-section { margin-top: 8px; padding-top: 6px; border-top: 1px solid #ddd; }
      #context-menu .collapse-toggle {
        display: block;
        width: 100%;
        text-align: left;
        margin: 3px 0;
        padding: 4px 6px;
        cursor: pointer;
        border: 0;
        background: #f2f4f7;
        font-size: 13px;
      }
      #context-menu .menu-group { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <script src="./vendor/live2d.min.js"></script>
    <canvas id="live2d-canvas"></canvas>
    <div id="context-menu"></div>
    <audio id="voice-audio"></audio>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
